<!DOCTYPE html>
<html lang="ar" dir="rtl" data-darkmode="false">
<head>
<meta charset="utf-8">
<title>SMARTLink — صفحة الدخول</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../luci-theme-smartlink/htdocs/luci-static/smartlink/cascade.css">
</head>
<body class="lang_ar">

<div class="sl-login-page">
	<div class="sl-login-card">
		<div class="sl-login-head">
			<svg class="sl-login-logo" viewBox="0 0 32 32" aria-hidden="true">
				<rect x="1" y="1" width="30" height="30" rx="8" fill="currentColor" opacity=".16"/>
				<path d="M20.8 10.4a6.6 6.6 0 0 0-4.9-2 6.6 6.6 0 0 0-4.7 1.9c-.6.6-.6 1.5 0 2.1.6.6 1.5.6 2.1 0a3.7 3.7 0 0 1 2.6-1c1 0 1.9.4 2.7 1.1.6.6 1.5.5 2.1-.1.6-.6.6-1.4.1-2Zm3.4-3.5A11.4 11.4 0 0 0 16 3.6c-3 0-5.9 1.2-8.1 3.3-.6.6-.6 1.5 0 2.1.6.6 1.5.6 2.1 0A8.4 8.4 0 0 1 16 6.6c2.2 0 4.3.8 5.9 2.3.6.6 1.6.6 2.2 0 .6-.6.6-1.5.1-2Zm-8.2 8.7a3.6 3.6 0 0 0-3.6 3.6c0 .9.3 1.7.9 2.4l2.7 3.2 2.7-3.2c.6-.7.9-1.5.9-2.4a3.6 3.6 0 0 0-3.6-3.6Z" fill="currentColor"/>
			</svg>
			<h1>SMARTLink</h1>
			<p>الرجاء إدخال اسم المستخدم وكلمة المرور.</p>
		</div>

		<div class="sl-login-form">
			<form method="post" class="cbi-map">
				<div class="cbi-section">
					<div class="cbi-section-node">
						<div class="cbi-value">
							<label class="cbi-value-title" for="u">اسم المستخدم</label>
							<div class="cbi-value-field"><input id="u" type="text" value="root"></div>
						</div>
						<div class="cbi-value">
							<label class="cbi-value-title" for="p">كلمة المرور</label>
							<div class="cbi-value-field"><input id="p" type="password"></div>
						</div>
					</div>
				</div>
			</form>
			<button class="btn cbi-button-positive important">تسجيل الدخول</button>
		</div>
	</div>
</div>

</body>
</html>
